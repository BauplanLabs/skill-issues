n_concurrent_trials: 1

environment:
  type: modal
  kwargs:
    secrets:
      # `<base-user>` is the rewrite anchor: `just launch-parallel` swaps it for
      # each worker's user so every worker gets its own secret
      - <your-modal-secret>-<base-user>
    # fresh Modal app so harbor builds a new image with the current task code,
    # leaving the shared __harbor__ app untouched; embeds the base user so
    # `just launch-parallel` gives each worker its own app via the same rewrite
    # that renames the secret
    app_name: __harbor_gepa_<base-user>__

agents:
  - name: oracle

datasets:
  - path: ./tasks
    task_names:
      - template-eval
