[project]
name = "skill-issues"
version = "1.0.0"
description = "Data-centric optimization of agent skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gepa~=0.1.1",
    "litellm~=1.84.0",
    "loguru~=0.7.3",
    "matplotlib~=3.11.0",
    "pydantic~=2.13.0",
    "python-dotenv~=1.0",
    "pyyaml~=6.0",
    "typer~=0.12",
]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { ty = false }

[tool.uv.workspace]
members = [
    "src/domains/bauplan_lakehouse",
]

[tool.ty.src]
exclude = ["src/domains/**/harness/**"]

[tool.ruff]
exclude = ["src/domains/**/harness/**"]

[dependency-groups]
dev = [
    "pre-commit~=4.6.0",
    "ty~=0.0.59",
]
